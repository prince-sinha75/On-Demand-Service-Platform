  <body>
    <div id="root"></div>
    <!-- GitHub Pages SPA redirect restore: reads the ?p= param set by 404.html
         and replaces the URL with the original deep link before React Router boots -->
    <script>
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
        // Also handle the ?p= query-param approach from 404.html
        var search = window.location.search;
        if (search.slice(1, 3) === 'p=') {
          var decoded = decodeURIComponent(search.slice(3)).replace(/&/, '?');
          history.replaceState(null, null, '/' + decoded + window.location.hash);
        }
      })();
    </script>
